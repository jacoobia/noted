[package]
name = "noted"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "A caching fetch CLI for agents: serves web pages and API responses from a local cache, as compact markdown"
license = "MIT OR Apache-2.0"
repository = "https://github.com/jacoobia/noted"
readme = "README.md"
keywords = ["cache", "cli", "fetch", "agents", "markdown"]
categories = ["command-line-utilities", "caching"]
publish = false

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
dirs = "7.0.0"
ego-tree = "0.11"
htmd = "0.5.6"
humantime = "2.4.0"
rusqlite = { version = "0.41.1", features = ["bundled"] }
scraper = "0.29.0"
serde_json = "1.0.154"
ureq = "3.5.1"
url = "2.5.8"

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
tempfile = "3.27.0"
tiny_http = "0.12.0"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
